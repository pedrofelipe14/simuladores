<style>
* { box-sizing: border-box; }
body { margin: 0; background: #008080; color: #000; font: 12px/1.4 Tahoma, 'MS Sans Serif', 'Microsoft Sans Serif', sans-serif; padding: 14px 14px 46px; min-height: 100vh; }
.emo, .em, .big { font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; font-weight: normal; }

/* relieves */
.win, button, .tabs .t { background: #c0c0c0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff; }
.sunken { background: #fff; box-shadow: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a; }

/* ventanas */
.win { padding: 3px; }
.title-bar { background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-weight: bold; padding: 3px 3px 3px 5px; display: flex; align-items: center; gap: 6px; user-select: none; }
.title-bar .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title-bar .ctl { display: flex; gap: 2px; }
.title-bar .ctl span { width: 16px; height: 14px; background: #c0c0c0; color: #000; font: bold 10px/14px Tahoma, sans-serif; text-align: center; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; }
.title-bar .ctl span:last-child { margin-left: 2px; }
.win-body { padding: 10px; }
.main-win { max-width: 1060px; margin: 0 auto; }
.desk-title { max-width: 1060px; margin: 4px auto 14px; color: #fff; font: bold 30px Tahoma, "MS Sans Serif", sans-serif; text-shadow: 2px 2px 0 #004040; letter-spacing: .5px; }

/* botones */
button { font: inherit; color: #000; border: 0; padding: 4px 12px; min-width: 75px; min-height: 23px; cursor: pointer; border-radius: 0; }
button:active:not(:disabled) { box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; padding: 5px 11px 3px 13px; }
button:focus-visible { outline: 1px dotted #000; outline-offset: -4px; }
button:disabled { color: #808080; text-shadow: 1px 1px 0 #fff; cursor: default; }
.lnk { background: none; box-shadow: none; padding: 0; min-width: 0; min-height: 0; color: #0000ee; text-decoration: underline; }
.lnk:active:not(:disabled) { box-shadow: none; padding: 0; color: #ee0000; }

/* barra de herramientas */
.toolbar { display: flex; align-items: center; gap: 8px; padding: 0 0 8px; margin-bottom: 10px; border-bottom: 1px solid #808080; box-shadow: 0 1px #fff; }
.toolbar h1 { font-size: 13px; margin: 0; }
.toolbar h1 a { color: #000; text-decoration: none; }
.toolbar .sub { color: #404040; }
.shows { display: flex; gap: 6px; margin-left: auto; }
.shows button { min-width: 0; padding: 7px 18px; font-size: 13px; font-weight: bold; min-height: 32px; }
.shows button:active:not(:disabled) { padding: 8px 17px 6px 19px; }
.shows button.on { color: #000080; background: #e0e0e0 repeating-conic-gradient(#c0c0c0 0 25%, #fff 0 50%) 0 0 / 2px 2px; box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; }
.shows + .back { margin-left: 4px; }
.back { margin-left: auto; color: #000; text-decoration: none; background: #c0c0c0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff; padding: 4px 12px; min-height: 23px; }
.back:active:not(:disabled) { color: #000; padding: 5px 11px 3px 13px; box-shadow: inset -1px -1px #fff, inset 1px 1px #0a0a0a, inset -2px -2px #dfdfdf, inset 2px 2px #808080; }
.home[hidden], .back[hidden], .stage[hidden] { display: none; }

/* grupos (fieldset) */
fieldset { border: 0; margin: 0; padding: 12px 12px 12px; box-shadow: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #808080, inset 2px 2px #fff; }
legend { padding: 0 4px; }

/* índice */
.home { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
.box .big { font-size: 40px; line-height: 1; float: left; margin: 2px 14px 6px 0; }
.box .k { color: #404040; }
.box h2 { font-size: 18px; margin: 2px 0 6px; }
.box p { margin: 0 0 12px; }
.box .main { font-weight: bold; clear: both; outline: 1px solid #000; outline-offset: 0; }
.seasons { display: flex; flex-direction: column; gap: 8px; }
.season { text-align: left; display: block; width: 100%; padding: 8px 10px; }
.season:active:not(:disabled) { padding: 9px 9px 7px 11px; }
.season b { display: block; }
.season small { color: #404040; font-size: 11px; }
.prog { height: 18px; margin: 6px 0 3px; padding: 3px; background: #fff; box-shadow: inset -1px -1px #fff, inset 1px 1px #808080, inset -2px -2px #dfdfdf, inset 2px 2px #0a0a0a; }
.prog i { display: block; height: 100%; background: repeating-linear-gradient(90deg, #000080 0 8px, transparent 8px 10px); }

/* reproductor */
.stage { margin-bottom: 12px; }
.screen { position: relative; aspect-ratio: 16/9; background: #000; }
.screen-wrap { padding: 3px; margin-bottom: 10px; }
.screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.screen:fullscreen { aspect-ratio: auto; }
.fs { position: absolute; right: 8px; top: 8px; z-index: 3; opacity: 0; }
.screen:hover .fs { opacity: 1; }
.info h2 { font-size: 16px; margin: 0 0 2px; }
.info h2 .em { margin-right: 4px; }
.info h2 .dur { font-weight: normal; color: #404040; font-size: 12px; }
.info .num { color: #404040; }
.info p { margin: 6px 0 10px; max-width: 800px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; }
.clock { margin-top: 8px; color: #404040; }

/* cartel de siguiente: un cuadro de diálogo */
.next-up { position: absolute; right: 16px; bottom: 60px; z-index: 4; width: 310px; max-width: calc(100% - 32px); }
.next-up[hidden] { display: none; }
.next-up .win-body { padding: 10px 12px 12px; }
.next-up .k { color: #404040; }
.next-up b { display: block; font-size: 13px; margin: 2px 0 8px; }
.next-up .meter { height: 18px; padding: 3px; margin-bottom: 10px; }
.next-up .meter i { display: block; height: 100%; background: repeating-linear-gradient(90deg, #000080 0 8px, transparent 8px 10px); transform-origin: left; transform: scaleX(0); }
.next-up .row { display: flex; gap: 6px; justify-content: flex-end; }
.next-up .go { font-weight: bold; outline: 1px solid #000; }

/* pestañas + lista */
.tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 2px; padding-left: 2px; position: relative; }
.tabs .t { min-width: 0; padding: 3px 12px 4px; text-decoration: none; color: #000; box-shadow: inset 1px 1px #fff, inset -1px 0 #0a0a0a, inset -2px 0 #808080; position: relative; top: 2px; }
.tabs .t.on { padding-bottom: 6px; top: 0; z-index: 1; font-weight: bold; }
.tabs .t:active { padding: 3px 12px 4px; }
.tabs .t.on:active { padding: 3px 12px 6px; }
.auto { display: flex; align-items: center; gap: 5px; margin: 0 0 4px 14px; cursor: pointer; }
.auto input { margin: 0; }
.count { margin: 0 4px 4px auto; color: #404040; }
.tabpanel { padding: 10px; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; background: #c0c0c0; }
ol.grid { list-style: none; margin: 0; padding: 2px; max-height: none; }
.ep { padding: 5px 8px 6px; cursor: pointer; border: 1px dotted transparent; }
.ep + .ep { border-top: 1px solid #e4e4e4; }
.ep:hover { background: #e8e8f4; }
.ep .top { display: flex; align-items: flex-start; gap: 8px; }
.ep .st { padding-top: 1px; }
.ep .em { font-size: 16px; line-height: 1; width: 20px; text-align: center; }
.ep .t { font-weight: bold; flex: 1; min-width: 0; }
.ep .st { color: #404040; white-space: nowrap; font-size: 11px; }
.ep .d { margin: 2px 0 0 28px; color: #404040; font-size: 11px; }
.ep.seen .st { color: #007000; }
.ep.on, .ep.on:hover { background: #000080; color: #fff; border-color: #ff0; border-style: dotted; }
.ep.on .st, .ep.on .d { color: #dcdcff; }

footer { color: #404040; font-size: 11px; margin-top: 8px; }

/* barra de tareas */
.taskbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(32px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom) !important; background: #c0c0c0; box-shadow: inset 0 1px #dfdfdf, inset 0 2px #fff; display: flex; align-items: center; gap: 6px; padding: 3px 3px 2px; z-index: 50; }
.start { font-weight: bold; min-width: 0; padding: 2px 8px; display: flex; align-items: center; gap: 5px; height: 24px; }
.start:active:not(:disabled) { padding: 3px 7px 1px 9px; }
.flag { width: 16px; height: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; transform: skewY(-6deg); }
.flag i:nth-child(1) { background: #e33; } .flag i:nth-child(2) { background: #3b3; } .flag i:nth-child(3) { background: #36e; } .flag i:nth-child(4) { background: #fc0; }

.tray { margin-left: auto; height: 24px; padding: 0 10px; display: flex; align-items: center; box-shadow: inset -1px -1px #fff, inset 1px 1px #808080; }

@media (max-width: 760px) {

  .task { width: auto; flex: 1; min-width: 0; }
}
@media (max-width: 600px) {
  .desk-title { font-size: 22px; margin: 10px 10px 10px; }
  body { padding: 0 0 40px; font-size: 13px; }

  .title-bar .ctl { display: none; }
  .win-body { padding: 8px; }
  .toolbar { flex-wrap: wrap; gap: 2px 8px; }
  .toolbar .sub { display: none; }
  .shows { margin-left: 0; order: 3; flex-basis: 100%; }
  .shows button { flex: 1; }
  .box .big { font-size: 32px; }
  .box h2 { font-size: 16px; }
  .info h2 { font-size: 15px; }
  .bar button { flex: 1; min-width: 0; padding-left: 6px; padding-right: 6px; }
  .bar #f-seen { flex-basis: 100%; }
  .tabs .t { padding: 3px 8px 4px; }
  .auto { order: 3; margin: 6px 0 6px 2px; flex-basis: 100%; }
  .count { order: 2; }
  .tabpanel { padding: 4px; }
  .ep { padding: 7px 6px; }
  .ep .d { margin-left: 28px; font-size: 12px; }
  .next-up { right: 8px; left: 8px; bottom: 8px; width: auto; max-width: none; }
  .next-up .win-body { padding: 6px 8px 8px; }
  .next-up .meter { margin-bottom: 6px; }
  .fs { display: none; }
  .tray { padding: 0 6px; }
}
/* sin mouse (celu/tablet): el botón de pantalla completa siempre visible */
@media (hover: none) { .fs { opacity: 1; } }
</style>

let show, DATA, ICON, flat, seen, season;
const key = (e) => `${e.t}x${e.n}`;
const hashOf = (e) => show === 'sim' ? key(e) : `${show}-${key(e)}`;
const ls = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
// cada serie guarda lo suyo (los de Los Simuladores siguen con la clave de antes)
const store = { get: (k, d) => ls.get(show + ':' + k, d), set: (k, v) => ls.set(show + ':' + k, v) };
const icon = (k) => ICON[k] || SHOWS[show].defIcon || '🎬';
function setShow(id) {
  show = SHOWS[id] ? id : 'sim';
  ls.set('app:show', show);
  ({ data: DATA, icon: ICON } = SHOWS[show]);
  flat = Object.entries(DATA).flatMap(([t, eps]) => eps.map((e) => ({ ...e, t: +t })));
  seen = new Set(store.get('seen', []));
  season = store.get('season', 1);
  if (!DATA[season]) season = 1;
  $('home-link').textContent = SHOWS[show].name;
  $('sub').textContent = SHOWS[show].sub;
  $('shows').innerHTML = Object.entries(SHOWS).map(([id, x]) => `<button type="button" data-show="${id}" class="${id === show ? 'on' : ''}">${x.name}</button>`).join('');
}
let current = null;
let auto = ls.get('sim:auto', true);
// ok.ru no avisa cuando termina el video: contamos el tiempo desde que le das play
// (cuando hacés click en el reproductor) contra la duración exacta del capítulo.
const clock = { running: false, since: 0, acc: 0, dismissed: false };
const COUNTDOWN = 12;
const elapsed = () => clock.acc + (clock.running ? (Date.now() - clock.since) / 1000 : 0);
const fmt = (x) => { x = Math.max(0, Math.round(x)); const h = Math.floor(x / 3600), m = Math.floor(x / 60) % 60, sec = x % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0'); };
function startClock() { if (!clock.running) { clock.running = true; clock.since = Date.now(); } }
function pauseClock() { if (clock.running) { clock.acc = elapsed(); clock.running = false; } }

function tabs() {
  $('tabs').innerHTML = Object.keys(DATA).map((t) => `<button data-t="${t}" class="lnk t${+t === season ? ' on' : ''}">Temporada ${t}</button>`).join('')
    + `<label class="auto"><input type="checkbox" id="auto" ${auto ? 'checked' : ''}/> pasar solo al siguiente</label>`
    + `<span class="count">vistos: ${flat.filter((e) => seen.has(key(e))).length}/${flat.length}</span>`;
}
function grid() {
  $('grid').innerHTML = DATA[season].map((e) => {
    const k = `${season}x${e.n}`;
    const on = current && key(current) === k;
    const st = on ? '▶ viendo' : seen.has(k) ? '✓ vista' : e.dur;
    return `<li class="ep${seen.has(k) ? ' seen' : ''}${on ? ' on' : ''}" data-k="${k}"><div class="top"><span class="em">${icon(k)}</span><span class="t">${/^Capítulo \d+$/.test(e.title) ? e.title : `${e.n}. ${e.title}`}</span><span class="st">${st}</span></div>${e.desc ? `<div class="d">${e.desc}</div>` : ''}</li>`;
  }).join('');
}
const code = (e) => `${e.t}x${String(e.n).padStart(2, '0')}`;
function home() {
  const last = flat.find((x) => key(x) === store.get('last', null));
  // si el último ya lo viste, te propone el que sigue
  const e = last && seen.has(key(last)) && flat[flat.indexOf(last) + 1] || last;
  $('hero').innerHTML = e
    ? `<div class="big">${icon(key(e))}</div><div class="k">${e === last ? 'Seguir viendo' : 'Te toca'} · ${code(e)} · ${e.dur}</div><h2>${e.title}</h2><p>${e.desc || SHOWS[show].about || ''}</p><button class="main" data-k="${key(e)}" type="button">▶ ${e === last ? 'seguir' : 'ver'}</button>`
    : `<div class="big">${icon('1x1')}</div><div class="k">Arrancá por el principio · 1x01 · ${flat[0].dur}</div><h2>${flat[0].title}</h2><p>${flat[0].desc || SHOWS[show].about || ''}</p><button class="main" data-k="1x1" type="button">▶ empezar</button>`;
  $('seasons').innerHTML = Object.entries(DATA).map(([t, eps]) => {
    const v = eps.filter((x) => seen.has(`${t}x${x.n}`)).length;
    const mins = Math.round(eps.reduce((a, x) => a + (x.secs || 0), 0) / 3600);
    return `<button class="season" data-t="${t}" type="button"><b>Temporada ${t}</b><small>${eps.length} capítulos · unas ${mins} horas</small><div class="prog"><i style="width:${(v / eps.length) * 100}%"></i></div><small style="margin:0">${v ? `viste ${v} de ${eps.length}` : 'sin empezar'}</small></button>`;
  }).join('');
}
function render() {
  tabs(); grid();
  $('home').hidden = !!current;
  $('back').hidden = !current;
  if (!current) home();
}
function winTitle(t) { $('wt').textContent = t; $('task').textContent = '📼 ' + t; document.title = t; }
function goHome() {
  winTitle(`Series argentinas - ${SHOWS[show].name}`);
  current = null;
  pauseClock(); hideNext();
  $('stage').hidden = true;
  $('player').src = 'about:blank';
  if (location.hash) history.pushState(null, '', location.pathname);
  render();
  window.scrollTo({ top: 0 });
}

function play(e, opts = {}) {
  current = e;
  season = e.t;
  store.set('season', season);
  store.set('last', key(e));
  $('stage').hidden = false;
  $('player').src = e.url + (opts.autoplay ? '?autoplay=1' : '');
  Object.assign(clock, { running: false, acc: 0, dismissed: false });
  if (opts.autoplay) startClock();
  hideNext();
  $('f-num').textContent = `temporada ${e.t}, capítulo ${e.n}`;
  $('f-title').textContent = e.title;
  winTitle(`${code(e)} - ${e.title}.avi - ${SHOWS[show].name}`);
  $('f-icon').textContent = icon(key(e));
  $('f-dur').textContent = e.dur;
  $('f-desc').textContent = e.desc || SHOWS[show].about || '';
  const i = flat.indexOf(e);
  $('prev').disabled = i === 0;
  $('next').disabled = i === flat.length - 1;
  seenBtn();
  render();
  if (location.hash !== `#${hashOf(e)}`) history[location.hash ? 'replaceState' : 'pushState'](null, '', `#${hashOf(e)}`);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function seenBtn() { $('f-seen').textContent = seen.has(key(current)) ? 'desmarcar vista' : 'marcar como vista'; }
function step(d, opts = {}) {
  const i = flat.indexOf(current) + d;
  if (!flat[i]) return;
  if (d > 0) { seen.add(key(current)); store.set('seen', [...seen]); }
  play(flat[i], opts);
}
const nextEp = () => flat[flat.indexOf(current) + 1];

function showNext() {
  const n = nextEp();
  if (!n) return;
  $('nu-k').textContent = `Sigue (${n.t}x${String(n.n).padStart(2, '0')}):`;
  $('nu-title').textContent = n.title;
  $('next-up').hidden = false;
}
function hideNext() { $('next-up').hidden = true; }

function tick() {
  if (!current) return;
  const left = current.secs - elapsed();
  const n = nextEp();
  // el relojito en la carpeta
  $('clock').innerHTML = !auto || !n ? ''
    : clock.running ? `pasa solo a "${n.title}" en ${fmt(left)} · <button id="c-pause" class="lnk" type="button">lo pausé</button>`
    : clock.acc > 0 ? `cuenta frenada (faltan ${fmt(left)}) · <button id="c-resume" class="lnk" type="button">ya le di play de nuevo</button>`
    : `cuando le des play empieza a contar para pasar solo al que sigue`;
  if (!auto || !n || clock.dismissed || !clock.running) return;
  if (left <= COUNTDOWN) {
    showNext();
    $('nu-bar').style.transform = `scaleX(${Math.min(1, 1 - left / COUNTDOWN)})`;
    if (left <= 0) step(1, { autoplay: true });
  }
}
setInterval(tick, 250);
const trayClock = () => { $('tray').textContent = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }); };
trayClock(); setInterval(trayClock, 10000);
$('start').onclick = () => goHome();

// click en el reproductor = el foco se va al iframe
addEventListener('blur', () => setTimeout(() => { if (document.activeElement === $('player')) startClock(); }));
$('nu-go').onclick = () => step(1, { autoplay: true });
$('nu-cancel').onclick = () => { clock.dismissed = true; hideNext(); };
const fsBtn = document.fullscreenEnabled ? $('fs') : ($('fs').remove(), null);
if (fsBtn) fsBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('screen').requestFullscreen();
document.addEventListener('keydown', (ev) => {
  if (ev.target.closest?.('input, textarea')) return;
  if (ev.key === 'f' || ev.key === 'F') fsBtn?.click();
  if ((ev.key === 'n' || ev.key === 'N') && current) step(1, { autoplay: true });
});

document.addEventListener('click', (ev) => {
  const sh = ev.target.closest('[data-show]');
  if (sh) { if (sh.dataset.show !== show) { setShow(sh.dataset.show); goHome(); } return; }
  const t = ev.target.closest('[data-t]');
  if (t) { season = +t.dataset.t; store.set('season', season); render(); if (t.classList.contains('season')) $('tabs').scrollIntoView({ behavior: 'smooth' }); return; }
  const ep = ev.target.closest('[data-k]');
  if (ep) return play(flat.find((x) => key(x) === ep.dataset.k));
  if (ev.target.id === 'c-pause') return pauseClock();
  if (ev.target.id === 'c-resume') return startClock();
});
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('f-seen').onclick = () => {
  const k = key(current);
  seen.has(k) ? seen.delete(k) : seen.add(k);
  store.set('seen', [...seen]);
  seenBtn(); render();
};

document.addEventListener('change', (ev) => { if (ev.target.id === 'auto') { auto = ev.target.checked; ls.set('sim:auto', auto); if (!auto) hideNext(); } });
$('back').onclick = goHome;
$('home-link').onclick = (ev) => { ev.preventDefault(); goHome(); };
function route() {
  const m = location.hash.match(/^#(?:([a-z]+)-)?(\d+x\d+)$/);
  if (m && (m[1] || 'sim') !== show) setShow(m[1] || 'sim');
  const e = m && flat.find((x) => key(x) === m[2]);
  if (e) { if (e !== current) play(e); } else if (current) goHome(); else render();
}
addEventListener('popstate', route);
setShow(ls.get('app:show', 'sim'));
winTitle(`Series argentinas - ${SHOWS[show].name}`);
route();
</script>
